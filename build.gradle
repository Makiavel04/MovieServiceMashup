plugins {
    id 'java'
    id "com.linecorp.thrift-gradle-plugin" version "0.6.1"
}

group = 'mashupmovie'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.apache.thrift:libthrift:0.19.0'
    implementation 'org.slf4j:slf4j-reload4j:2.0.16'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
}

compileThrift {
    thriftExecutable "/usr/bin/thrift"
    sourceDir "$projectDir/src/main/thrift"
    outputDir "$projectDir/generated/java"
    nowarn true
    strict true
    verbose true
    recurse true
    debug true
    createGenFolder false
    generator 'java', 'private-members'

}

test {
    useJUnitPlatform()
}



plugins {
    id 'java'
    id "com.gradleup.shadow" version "8.3.2"
}

repositories {
    mavenCentral()
}

sourceSets.main.java.srcDirs += ['../generated/java']

dependencies {
    implementation 'commons-cli:commons-cli:1.9.0'
    implementation 'org.apache.thrift:libthrift:0.19.0'
    implementation 'org.slf4j:slf4j-reload4j:2.0.16'
    implementation 'javax.annotation:javax.annotation-api:1.3.2'
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5', version: '5.2.1'
    implementation group: 'org.apache.httpcomponents.client5', name: 'httpclient5-fluent', version: '5.2.1'
    implementation("com.fasterxml.jackson.core:jackson-databind:2.22.2")
    implementation("com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.2")
}

compileJava {
    dependsOn ':compileThrift'
}


java {
    sourceCompatibility = '17'
}

jar {
    manifest {
        attributes 'Main-Class': 'moviemashup.client.Main'
    }
}

shadowJar {
    manifest {
        attributes 'Main-Class': 'moviemashup.client.Main'
    }
}